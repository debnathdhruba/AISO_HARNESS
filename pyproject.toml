[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-harness"
version = "0.1.0"
description = "Standalone durable agent harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx",
    "pydantic>=2,<3",
    "pymongo>=4.19,<5",
    "python-dotenv>=1,<2",
    "typer",
    "jsonschema",
]

[project.scripts]
agent-harness = "agent_harness.interfaces.cli:main"

[project.optional-dependencies]
dev = ["aiosqlite", "hatchling", "mypy", "pytest", "pytest-asyncio", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_harness"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "TID"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"aios" = { msg = "The harness must remain standalone." }
"cerebrum" = { msg = "The harness must remain standalone." }

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/agent_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-config --strict-markers"

[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*"]
ignore_missing_imports = true
